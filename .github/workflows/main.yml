name: Monorepo CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11" # Use your desired Python version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies with uv
        run: uv sync --frozen
        working-directory: ./apps/python-ocr

      - name: Fanyi (Electron) Checks
        run: |
          pnpm --filter fanyi lint
          pnpm --filter fanyi format:check
          pnpm --filter fanyi compile
          pnpm --filter fanyi test:ci

      - name: Python OCR Checks
        if: always()
        run: |
          pnpm --filter python-ocr lint
          pnpm --filter python-ocr test
