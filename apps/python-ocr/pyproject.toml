[project]
name = "python-ocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jieba>=0.42.1",
    "paddleocr==3.3.0",
    "paddlepaddle==3.2.0",
    "pillow>=11.3.0",
    "ruff>=0.12.8",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.15.0",
]

[tool.ruff]
indent-width = 2
  
[tool.ruff.format]
quote-style="double"
line-ending="lf"
indent-style="space"
