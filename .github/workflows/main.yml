name: Monorepo CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter fanyi lint

      - name: Format check
        run: pnpm --filter fanyi format:check

      - name: Build app
        run: pnpm --filter fanyi build:app

      - name: Test
        run: pnpm --filter fanyi test:ci

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install Python dependencies with uv
        run: uv sync --frozen
        working-directory: ./apps/python-ocr

      - name: Lint
        run: uv run --frozen ruff check
        working-directory: ./apps/python-ocr

      - name: Format check
        run: uv run --frozen ruff format --check
        working-directory: ./apps/python-ocr

      - name: Test
        run: uv run --frozen pytest
        working-directory: ./apps/python-ocr
